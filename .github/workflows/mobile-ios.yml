# بناء تطبيق iOS في السحابة — بلا Xcode على جهازك.
#
# **ويبني Flutter لا غلافَ Capacitor.** كان يُنفّذ `cap sync` فيبني التطبيقَ
# القديم؛ واستُبدل بالأصيل، فبقي المسارُ يرفع ما استُبدل. وآلةُ التوقيع
# والتصدير والرفع هي هي — غُيّر ما تُوجَّه إليه وحده.
#
# بناءُ iOS يتطلّب macOS وXcode في **مكانٍ ما**، ولا مفرّ من ذلك. وجهاز
# `macos-26` هنا يحملهما، فيبقى جهازُك نظيفًا. والإصدار مقصود: أبل ترفض
# رفعًا بـSDK أقدم من 26، وصورةُ `macos-15` تحمل 18.5 — فيُبنى ويُوقَّع
# ثمّ يُردّ في آخر خطوة.
#
# والتوقيع بمفتاح App Store Connect وحده — لا شهادة `.p12` ولا ملفّ تعريف
# يُصنع باليد. وبلا المفتاح يُبنى التطبيق **بلا توقيع**: يُتحقَّق أنّه يُترجم
# ويُربط، ولا يُنتج `.ipa` صالحًا للتثبيت.
name: تطبيق iOS

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    # صورةٌ تحمل Xcode 26 — وأبل لا تقبل رفعًا بـSDK أقدم من 26.
    # و`macos-15` تحمل Xcode 16 بـSDK 18.5، فيُبنى ويُوقَّع ثمّ يُردّ عند الرفع.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------- أحدثُ Xcode
      #
      # **ويُفحص الحدّ قبل البناء لا بعده.**
      #
      # أبل تشترط SDK 26 أو أحدث، وردُّها يقع في **آخر** خطوة — بعد أربع دقائق
      # من ترجمةٍ وأرشفةٍ وتوقيع. فيُقرأ رقم SDK أوّلًا ويُوقف البناء بسببٍ
      # مقروء، بدل أن يسقط في نهايته بخطأ 409 من خادمٍ بعيد.
      - name: اختيار Xcode والتحقّق من حدّ أبل
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$NEWEST" ]; then
            echo "::error::لا Xcode على هذه الصورة"
            exit 1
          fi
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          echo "Xcode: $(xcodebuild -version | head -1)  ($NEWEST)"

          SDK=$(xcodebuild -showsdks 2>/dev/null | grep -oE 'iphoneos[0-9]+\.[0-9]+' | grep -oE '[0-9]+\.[0-9]+' | sort -V | tail -1)
          echo "iOS SDK: $SDK"
          MAJOR=${SDK%%.*}
          if [ "${MAJOR:-0}" -lt 26 ]; then
            echo "::error::SDK $SDK أقدم من 26 — وأبل ترفض الرفع. الصورة تحتاج Xcode 26 أو أحدث."
            exit 1
          fi

      # ---------------------------------------------------------- Flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      # ------------------------------------------------------- خطُّ اللوحة
      #
      # **بلاه لا يُبنى شيء.** `pubspec.yaml` يُعلن `plate-arial-bold.ttf`
      # أصلًا، و`.gitignore` يستثنيه — فنسخةٌ نظيفةٌ تسقط بـ
      # `Failed to compile`. جُرّب: أُخفي الملفُّ فسقط البناء، لا تحذيرٌ ولا
      # تجاوز.
      #
      # ولا يُودَع في المستودع: ترخيصُ Monotype يُجيز تضمينَه في حزمةِ تطبيق،
      # لا نشرَه في كودٍ علنيّ — وهما إذنان مختلفان.
      #
      # فيُؤخذ من سرٍّ إن ضُبط، وإلّا من خطوط هذا الخادم — وهو macOS وفيه
      # Arial Bold. والترتيبُ مقصود: السرُّ يُثبّت نسخةً بعينها، وخطُّ الخادم
      # يتبدّل مع صورته.
      - name: تهيئة خطّ اللوحة
        env:
          FONT_B64: ${{ secrets.PLATE_ARIAL_BOLD_BASE64 }}
        run: |
          DEST=mobile/assets/fonts/plate-arial-bold.ttf
          if [ -n "$FONT_B64" ]; then
            echo "$FONT_B64" | base64 -d > "$DEST"
            echo "::notice::خطُّ اللوحة من السرّ"
          else
            bash mobile/tool/setup-fonts.sh
            echo "::notice::خطُّ اللوحة من خطوط الخادم"
          fi
          # ويُتحقَّق أنّه خطٌّ فعلًا — لا سرٌّ مبتورٌ يُفكّ إلى بايتاتٍ عمياء
          if [ ! -s "$DEST" ] || ! file "$DEST" | grep -qi 'font'; then
            echo "::error::خطُّ اللوحة ناقصٌ أو تالف — البناء لا يقوم بلاه"
            exit 1
          fi
          ls -l "$DEST"

      - name: جلب الاعتماديات
        working-directory: mobile
        run: flutter pub get

      # **والفحوصُ قبل البناء لا بعده**: رفعٌ إلى TestFlight ببناءٍ لم يُقَس
      # يُنفق مراجعةً على عطبٍ كان يُكشف في دقيقة.
      - name: فحوصُ التطبيق
        working-directory: mobile
        run: flutter test

      # ---------------------------------------------------- أرقام النسخة
      #
      # **رقم البناء من عدّاد التشغيل، لا من الملفّ.**
      #
      # App Store Connect يرفض رقم بناءٍ استُعمل مرّةً — ورقمٌ ثابتٌ في
      # `project.pbxproj` يعني أنّ كلّ رفعٍ بعد الأوّل يُردّ، فيُعدَّل الملفّ
      # ويُودَع لكلّ رفعة. وعدّادُ جيت هب يتزايد من تلقائه ولا يتكرّر.
      #
      # ورقم النسخة من **الوسم**: `v1.0.1` ⟵ `1.0.1`. فما يُقرأ في المتجر هو
      # ما وُسم في المستودع، ولا يفترقان. وبلا وسمٍ (تشغيلٌ يدويّ) يبقى ما في
      # الملفّ — فالبناء تحقّقٌ لا إصدار.
      - name: اشتقاق النسخة ورقم البناء
        id: version
        run: |
          BUILD="${{ github.run_number }}"
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/v* ]]; then
            MARKETING="${REF#refs/tags/v}"
          else
            MARKETING=""
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "marketing=$MARKETING" >> "$GITHUB_OUTPUT"
          echo "::notice::رقم البناء $BUILD${MARKETING:+ · النسخة $MARKETING}"

      # ----------------------------------------------------------- التوقيع
      #
      # **مفتاح App Store Connect وحده** — لا شهادة `.p12` ولا ملفّ تعريف.
      #
      # و`-allowProvisioningUpdates` مع مفتاح واجهة أبل يجعل Xcode على الخادم
      # يُصدر الشهادة ويُنشئ ملفّ التعريف ويُنزّلهما بنفسه. والطريق القديم
      # يقتضي توليد طلب توقيعٍ في Keychain على ماك، وتصدير `.p12`، وإنشاء
      # ملفّ تعريفٍ باليد، وتجديدَ ذلك كلَّه كلّ سنة — وصاحبُ هذه المنصّة لا
      # Xcode عنده أصلًا.
      #
      # والمفتاح سرٌّ واحد يُبطَل من اللوحة إن تسرّب، بخلاف شهادةٍ يُعاد بناء
      # كلّ شيءٍ حولها.
      - name: تهيئة مفتاح التوقيع
        id: signing
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$KEY_P8" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$TEAM_ID" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::لا مفتاح توقيع — سيُبنى تحقّقًا من الترجمة فقط"
            exit 0
          fi

          # خارج مساحة العمل: ما في مجلّد المستودع قد يُلتقط في أثرٍ يُرفع
          KEY_DIR=$RUNNER_TEMP/private_keys
          mkdir -p "$KEY_DIR"
          echo "$KEY_P8" | base64 -d > "$KEY_DIR/AuthKey_$KEY_ID.p8"
          chmod 600 "$KEY_DIR/AuthKey_$KEY_ID.p8"

          echo "key_path=$KEY_DIR/AuthKey_$KEY_ID.p8" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: بناء تحقّقٍ بلا توقيع
        if: steps.signing.outputs.signed != 'true'
        working-directory: mobile
        # يُثبت أنّ التطبيق يُترجم ويُربط — ولا يُنتج ما يُثبَّت على جهاز.
        run: flutter build ios --release --no-codesign

      - name: أرشفة وتصدير IPA
        if: steps.signing.outputs.signed == 'true'
        working-directory: mobile
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_PATH: ${{ steps.signing.outputs.key_path }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
        run: |
          # ---------------------------------------------------------------
          # **الأرقامُ تُمرَّر إلى Flutter لا إلى xcodebuild.**
          #
          # فـ`flutter build` يكتب `Generated.xcconfig`، وخطوةُ البناء داخل
          # Xcode تقرؤه — فما يُمرَّر لـ`xcodebuild` يُدهَس بما وُلّد.
          #
          # وما لا يُوسَم يبقى على ما في `pubspec` — فلا يُغيّر تحقّقٌ رقمَ إصدار.
          VERSION_ARGS=(--build-number="$BUILD_NUMBER")
          if [ -n "$MARKETING_VERSION" ]; then
            VERSION_ARGS+=(--build-name="$MARKETING_VERSION")
          fi

          # `--config-only` يكتب الإعداد ويجلب الإضافات ولا يترجم: الترجمةُ
          # تقع في `xcodebuild archive` نفسِه عبر خطوة Flutter في المشروع،
          # فلا يُبنى الشيءُ مرّتين.
          #
          # **و`--no-codesign` معه وإن كنّا نوقّع.** فـ`flutter build` يفحص
          # الشهاداتِ في حلقة المفاتيح بنفسه قبل أن يكتب شيئًا، ومفتاحُنا
          # مفتاحُ واجهةٍ يفهمه `xcodebuild` وحده مع
          # `-allowProvisioningUpdates` — فيسقط Flutter بـ«لا شهادة» على
          # بناءٍ توقيعُه مضمون. والتوقيعُ يقع في الأرشفة لا هنا.
          flutter build ios --release --config-only --no-codesign "${VERSION_ARGS[@]}"

          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>automatic</string>
            <!-- لا يدير Xcode الأرقام: نحن نمرّرها، وإدارتُه تتجاهل ما مرّرناه -->
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST

          # `-allowProvisioningUpdates` هي التي تأذن لـXcode بإصدار ما ينقص.
          # وبلا المفاتيح الثلاثة لا يجد بمن يُخاطب أبل فيسقط بسؤالٍ لا مجيب له.
          AUTH=(
            -allowProvisioningUpdates
            -authenticationKeyPath "$KEY_PATH"
            -authenticationKeyID "$KEY_ID"
            -authenticationKeyIssuerID "$ISSUER_ID"
          )

          # **وإعدادُ التوقيع في المشروع لا هنا.**
          #
          # قُرئ في سجلّ بناءٍ ساقط: `CODE_SIGN_STYLE=` فارغةً و
          # `CODE_SIGN_IDENTITY="Apple Development"`. فهدفُ `Runner` في قالب
          # Flutter لا يضبط الأسلوبَ أصلًا (المضبوطُ لهدف الفحوص وحده)،
          # وبفراغه يختار Xcode التطويرَ — وملفُّ التطوير يشترط أجهزةً
          # مسجّلة، فيسقط بـ«فريقُك بلا أجهزة» على أرشفةٍ لا جهازَ فيها.
          #
          # ومُرّرت من هنا فطُبّقت — وبقي يختار التطوير. فتحديدُ الهويّة من
          # سطر الأمر يتعارض مع التوقيع التلقائيّ («إعداداتُ تعريفٍ متضاربة»)،
          # والأسلوبُ وحده لا يكفي.
          #
          # فكُتب `CODE_SIGN_STYLE = Automatic` في `project.pbxproj` حيث كتبه
          # مشروعُ Capacitor. وجُرّبت معه `Apple Distribution` فسقط بـ«مُوقَّعٌ
          # تلقائيًّا للتطوير، والهويّةُ حُدّدت يدويًّا» — فمع التلقائيّ لا
          # تُحدَّد هويّة، يختارها Xcode.
          #
          # **ويبقى شرطُ أبل**: التوقيعُ التلقائيُّ يُوقّع الأرشيفَ بملفّ
          # **تطوير** ثمّ يُعيد توقيعَه توزيعًا عند التصدير — وملفُّ التطوير
          # يشترط جهازًا واحدًا مسجَّلًا في الحساب. فبلا جهازٍ لا تقوم أرشفةٌ
          # تلقائيّةُ التوقيع، مهما ضُبط في المشروع.
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            "${AUTH[@]}" \
            DEVELOPMENT_TEAM="$TEAM_ID"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}"

      - name: رفع المخرجات
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ github.sha }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 7

      # --------------------------------------------- الرفع إلى TestFlight
      - name: رفع إلى TestFlight
        if: steps.signing.outputs.signed == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          # مفتاح App Store Connect — أسلم من كلمة مرورٍ لحسابٍ كامل
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          # المفتاح نفسه الذي وقّع — يُنسخ حيث تطلبه `altool`
          mkdir -p ~/.private_keys
          cp "${{ steps.signing.outputs.key_path }}" ~/.private_keys/
          xcrun altool --upload-app -f "$RUNNER_TEMP"/export/*.ipa -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      # ------------------------------------------- تبليغُ اللوحة بما رُفع
      #
      # TestFlight لا واجهةَ علنيّةَ له، ومفتاحُ App Store Connect ليس عند
      # الخادم — فلا يعلم الرقمَ إلّا من رفعه. فيُبلَّغ هنا، فتقرأ اللوحةُ
      # ما عند المختبِرين بلا أن يُفتح موقعُ أبل.
      #
      # **وبعد الرفع لا قبله**: ما لم يصل لا يُسجَّل أنّه وصل.
      #
      # و`continue-on-error` مقصود: بناءٌ رُفع بنجاحٍ لا يُصبَغ أحمرَ لأنّ
      # تسجيلَ رقمٍ تعذّر. ويُقرأ التحذيرُ ويُعاد التبليغُ بإثباتٍ في اللوحة.
      - name: تبليغُ اللوحة بالإصدار
        if: steps.signing.outputs.signed == 'true' && startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        env:
          APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          REPORT_SECRET: ${{ secrets.RELEASE_REPORT_SECRET }}
          VERSION: ${{ steps.version.outputs.marketing }}
          BUILD: ${{ steps.version.outputs.build }}
          COMMIT: ${{ github.sha }}
        run: |
          if [ -z "$REPORT_SECRET" ]; then
            echo "::notice::لا سرَّ تبليغٍ مضبوط — لا يُسجَّل الإصدار في اللوحة"
            exit 0
          fi
          # بـ`jq` لا بتضمينٍ في نصّ: رقمٌ فيه محرفُ اقتباسٍ يكسر JSON المبنيّ بيد
          BODY=$(jq -n --arg v "$VERSION" --arg b "$BUILD" --arg c "$COMMIT" \
            '{platform:"ios",channel:"testing",version:$v,build:$b,commit:$c}')
          curl -fsS --max-time 20 -X POST "$APP_URL/api/internal/app-release" \
            -H 'content-type: application/json' \
            -H "x-release-report: $REPORT_SECRET" \
            -d "$BODY" > /dev/null
          echo "::notice::سُجّل في اللوحة: $VERSION (بناء $BUILD)"
