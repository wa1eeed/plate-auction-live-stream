# بناء تطبيق iOS في السحابة — بلا Xcode على جهازك.
#
# بناءُ iOS يتطلّب macOS وXcode في **مكانٍ ما**، ولا مفرّ من ذلك. وجهاز
# `macos-15` هنا يحملهما، فيبقى جهازُك نظيفًا.
#
# وبلا شهادة توقيع يُبنى التطبيق **بلا توقيع**: يُتحقَّق أنّه يُترجم ويُربط —
# وهو ما يُراد قبل شراء حسابٍ أو إصدار شهادة — ولا يُنتج `.ipa` صالحًا للتثبيت.
name: تطبيق iOS

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: تثبيت الاعتماديات
        run: pnpm install --frozen-lockfile

      - name: مزامنة الغلاف
        run: npx cap sync ios

      # ----------------------------------------------------------- التوقيع
      - name: تهيئة الشهادة والتعريف
        id: signing
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$CERT_P12" ] || [ -z "$PROFILE" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::لا شهادة توقيع — سيُبنى تحقّقًا من الترجمة فقط"
            exit 0
          fi

          # سلسلة مفاتيح مؤقّتة تعيش مع الوظيفة وتموت معها — لا تُلمَس سلسلة
          # النظام، ولا يبقى مفتاحٌ بعد انتهاء البناء.
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          # بدونه يسأل `codesign` عن كلمة السلسلة في كلّ استدعاء فيتعلّق البناء
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          PROFILES=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROFILES"
          echo "$PROFILE" | base64 -d > "$PROFILES/build.mobileprovision"

          rm -f "$RUNNER_TEMP/cert.p12"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: بناء تحقّقٍ بلا توقيع
        if: steps.signing.outputs.signed != 'true'
        working-directory: ios/App
        # يُثبت أنّ المشروع يُترجم ويُربط — ولا يُنتج ما يُثبَّت على جهاز
        run: |
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: أرشفة وتصدير IPA
        if: steps.signing.outputs.signed == 'true'
        working-directory: ios/App
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST

          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: رفع المخرجات
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ github.sha }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 7

      # --------------------------------------------- الرفع إلى TestFlight
      - name: رفع إلى TestFlight
        if: steps.signing.outputs.signed == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          # مفتاح App Store Connect — أسلم من كلمة مرورٍ لحسابٍ كامل
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8_BASE64 }}
        run: |
          if [ -z "$KEY_P8" ]; then
            echo "::notice::لا مفتاح App Store Connect — لم يُرفع شيء"
            exit 0
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY_P8" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          xcrun altool --upload-app -f "$RUNNER_TEMP"/export/*.ipa -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
