# بناء تطبيق iOS في السحابة — بلا Xcode على جهازك.
#
# بناءُ iOS يتطلّب macOS وXcode في **مكانٍ ما**، ولا مفرّ من ذلك. وجهاز
# `macos-15` هنا يحملهما، فيبقى جهازُك نظيفًا.
#
# والتوقيع بمفتاح App Store Connect وحده — لا شهادة `.p12` ولا ملفّ تعريف
# يُصنع باليد. وبلا المفتاح يُبنى التطبيق **بلا توقيع**: يُتحقَّق أنّه يُترجم
# ويُربط، ولا يُنتج `.ipa` صالحًا للتثبيت.
name: تطبيق iOS

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # بلا `version`: يتبع `packageManager` في `package.json` — وتحديدُه هنا
      # يتعارض معه فيسقط قبل أن يبدأ شيء
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: تثبيت الاعتماديات
        run: pnpm install --frozen-lockfile

      - name: مزامنة الغلاف
        run: npx cap sync ios

      # ---------------------------------------------------- أرقام النسخة
      #
      # **رقم البناء من عدّاد التشغيل، لا من الملفّ.**
      #
      # App Store Connect يرفض رقم بناءٍ استُعمل مرّةً — ورقمٌ ثابتٌ في
      # `project.pbxproj` يعني أنّ كلّ رفعٍ بعد الأوّل يُردّ، فيُعدَّل الملفّ
      # ويُودَع لكلّ رفعة. وعدّادُ جيت هب يتزايد من تلقائه ولا يتكرّر.
      #
      # ورقم النسخة من **الوسم**: `v1.0.1` ⟵ `1.0.1`. فما يُقرأ في المتجر هو
      # ما وُسم في المستودع، ولا يفترقان. وبلا وسمٍ (تشغيلٌ يدويّ) يبقى ما في
      # الملفّ — فالبناء تحقّقٌ لا إصدار.
      - name: اشتقاق النسخة ورقم البناء
        id: version
        run: |
          BUILD="${{ github.run_number }}"
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/v* ]]; then
            MARKETING="${REF#refs/tags/v}"
          else
            MARKETING=""
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "marketing=$MARKETING" >> "$GITHUB_OUTPUT"
          echo "::notice::رقم البناء $BUILD${MARKETING:+ · النسخة $MARKETING}"

      # ----------------------------------------------------------- التوقيع
      #
      # **مفتاح App Store Connect وحده** — لا شهادة `.p12` ولا ملفّ تعريف.
      #
      # و`-allowProvisioningUpdates` مع مفتاح واجهة أبل يجعل Xcode على الخادم
      # يُصدر الشهادة ويُنشئ ملفّ التعريف ويُنزّلهما بنفسه. والطريق القديم
      # يقتضي توليد طلب توقيعٍ في Keychain على ماك، وتصدير `.p12`، وإنشاء
      # ملفّ تعريفٍ باليد، وتجديدَ ذلك كلَّه كلّ سنة — وصاحبُ هذه المنصّة لا
      # Xcode عنده أصلًا.
      #
      # والمفتاح سرٌّ واحد يُبطَل من اللوحة إن تسرّب، بخلاف شهادةٍ يُعاد بناء
      # كلّ شيءٍ حولها.
      - name: تهيئة مفتاح التوقيع
        id: signing
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$KEY_P8" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$TEAM_ID" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::لا مفتاح توقيع — سيُبنى تحقّقًا من الترجمة فقط"
            exit 0
          fi

          # خارج مساحة العمل: ما في مجلّد المستودع قد يُلتقط في أثرٍ يُرفع
          KEY_DIR=$RUNNER_TEMP/private_keys
          mkdir -p "$KEY_DIR"
          echo "$KEY_P8" | base64 -d > "$KEY_DIR/AuthKey_$KEY_ID.p8"
          chmod 600 "$KEY_DIR/AuthKey_$KEY_ID.p8"

          echo "key_path=$KEY_DIR/AuthKey_$KEY_ID.p8" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: بناء تحقّقٍ بلا توقيع
        if: steps.signing.outputs.signed != 'true'
        working-directory: ios/App
        # يُثبت أنّ المشروع يُترجم ويُربط — ولا يُنتج ما يُثبَّت على جهاز.
        # والاستحقاقات تُعطَّل: بلا فريقٍ لا ملفّ تعريف يحملها.
        run: |
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_ENTITLEMENTS=

      - name: أرشفة وتصدير IPA
        if: steps.signing.outputs.signed == 'true'
        working-directory: ios/App
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_PATH: ${{ steps.signing.outputs.key_path }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
        run: |
          # ما لا يُوسَم يبقى على ما في الملفّ — فلا يُغيّر تحقّقٌ رقمَ إصدار
          VERSION_ARGS="CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
          if [ -n "$MARKETING_VERSION" ]; then
            VERSION_ARGS="$VERSION_ARGS MARKETING_VERSION=$MARKETING_VERSION"
          fi

          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>automatic</string>
            <!-- لا يدير Xcode الأرقام: نحن نمرّرها، وإدارتُه تتجاهل ما مرّرناه -->
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST

          # `-allowProvisioningUpdates` هي التي تأذن لـXcode بإصدار ما ينقص.
          # وبلا المفاتيح الثلاثة لا يجد بمن يُخاطب أبل فيسقط بسؤالٍ لا مجيب له.
          AUTH=(
            -allowProvisioningUpdates
            -authenticationKeyPath "$KEY_PATH"
            -authenticationKeyID "$KEY_ID"
            -authenticationKeyIssuerID "$ISSUER_ID"
          )

          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            "${AUTH[@]}" \
            ${VERSION_ARGS} \
            DEVELOPMENT_TEAM="$TEAM_ID"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}"

      - name: رفع المخرجات
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ github.sha }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 7

      # --------------------------------------------- الرفع إلى TestFlight
      - name: رفع إلى TestFlight
        if: steps.signing.outputs.signed == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          # مفتاح App Store Connect — أسلم من كلمة مرورٍ لحسابٍ كامل
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          # المفتاح نفسه الذي وقّع — يُنسخ حيث تطلبه `altool`
          mkdir -p ~/.private_keys
          cp "${{ steps.signing.outputs.key_path }}" ~/.private_keys/
          xcrun altool --upload-app -f "$RUNNER_TEMP"/export/*.ipa -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
