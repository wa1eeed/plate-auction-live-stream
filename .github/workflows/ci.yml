name: البوّابة

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: فحص الأنواع
        run: pnpm typecheck

      - name: التدقيق
        run: pnpm lint

      - name: اختبارات الوحدة
        run: pnpm test

      # الاختبار الشامل يبني مبنى إنتاج ويشغّل server.mjs الحقيقي بمقبسه —
      # فهو يغطّي مسار التشغيل الذي تشغّله الحاوية نفسه
      - name: تثبيت متصفّح الاختبار
        run: pnpm exec playwright install --with-deps chromium

      - name: الاختبار الشامل
        run: pnpm test:e2e
        env:
          SESSION_SECRET: ci-secret-not-a-real-one

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ---- ما لا يُقاس بقراءة كود: الثغرات المعروفة والأسرار المسرَّبة
  #
  # ووظيفةٌ مستقلّة لا خطوةٌ في البوّابة: هذه تسقط بما لا نكتبه نحن — تحذيرٌ
  # يُنشر اليوم في حزمةٍ لم تتغيّر عندنا. فخلطُها بفحص الكود يجعل إخفاق
  # المستودع يبدو إخفاقَ آخر تعديل، ويُعلَّم بالتجاهل.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # التاريخ كلُّه: سرٌّ حُذف في تعديلٍ لاحق يبقى في الإيداع الذي أدخله
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ---- ما يصل المستخدم: تبعيات الإنتاج وحدها، ويسقط البناء عليها
      #
      # و`--prod` لا `--dev`: ثغرةٌ في vitest لا تُشحن إلى أحد، وإسقاطُ
      # البوّابة عليها يوقف العمل بلا خطرٍ يُدفع. وما يصل المستخدم لا يُساوَم.
      - name: ثغرات في تبعيات الإنتاج
        run: pnpm audit --prod --audit-level moderate

      # ---- وأدوات التطوير تُعرَض ولا تُسقط
      - name: ثغرات في أدوات التطوير (للعلم)
        continue-on-error: true
        run: pnpm audit --audit-level high

      # ---- أسرارٌ مسرَّبة: في الشجرة وفي التاريخ
      #
      # مفتاحٌ يُدفع سهوًا لا يكفي حذفُه في تعديلٍ بعده — يبقى في الإيداع الذي
      # أدخله، ويُقرأ من تاريخ المستودع. فيُفحص التاريخ لا آخر لقطةٍ منه.
      # الصورة مباشرةً لا الإجراء الرسميّ: ذاك يطلب ترخيصًا للمؤسّسات،
      # وبوّابةٌ تتوقّف على ترخيصٍ يومًا بوّابةٌ تُعطَّل.
      - name: أسرار مسرَّبة — في الشجرة وفي التاريخ
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest \
            detect --source . --config /repo/.gitleaks.toml --no-banner --redact

  # ----------------------------------------------------------------------
  # الصورة تُبنى هنا وتُدفع — والخادم يسحب ولا يبني.
  #
  # وكان الخادم يبنيها بنفسه، فسقطت نشرةُ ٢٥ سبتمبر عند `pnpm build` ببانرِ
  # Next ثمّ صمتٍ بلا سطر خطأ — وهي صورةُ عمليةٍ تُقتل لضيق المورد. والبناءُ
  # نفسه على عُقدة البوّابة نجح، فالعلّة في بيئة الخادم لا فيما يُبنى.
  #
  # فبناءٌ واحدٌ في مكانٍ واسع، وسحبٌ على الخادم. ويبقى الغرضُ الأوّل قائمًا:
  # أن ينكسر البناءُ هنا لا هناك — فالوظيفةُ تبني في طلبات الدمج أيضًا ولا
  # تدفع إلّا من `main`.
  # ----------------------------------------------------------------------
  image:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # لا سرَّ يُضبط: `GITHUB_TOKEN` يكفي لسجلّ المستودع نفسه
      - name: الدخول إلى سجلّ GitHub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: بناء صورة الإنتاج ودفعها
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          # `latest` لما يسحبه الخادم، والبصمةُ لتثبيت نشرةٍ بعينها أو الرجوع
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          # ‏`NEXT_PUBLIC_*` يُحقن في حزمة المتصفّح وقت البناء لا وقت التشغيل،
          # فلا يُترك لكوليفاي يضبطه بعدُ — يُخبز هنا أو خرج خاطئًا.
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://mazad.nx.sa' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
