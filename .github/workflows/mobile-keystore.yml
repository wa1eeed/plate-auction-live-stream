# توليد مفتاح توقيع أندرويد — مرّةً واحدة، بلا Java على جهازك.
#
# `keytool` يحتاج Java، وهي على جهاز الأكشن لا على جهازك. والمفتاح **سرٌّ**:
# من ملكه وقّع باسمك، ولا تقبل Play حزمةً موقّعةً بغيره بعد أوّل رفع — فضياعه
# يعني تطبيقًا لا يُحدَّث أبدًا.
#
# ولذلك **لا يُطبَع في السجلّ ولا يُرفع خامًا**: يُعمّى بعبارة مرورٍ تضعها أنت
# في `KEYSTORE_EXPORT_PASSWORD`، ويخرج ملفًّا معمًّى تفكّه على جهازك بـ`openssl`
# (وهو موجودٌ في macOS أصلًا).
name: توليد مفتاح توقيع أندرويد

on:
  workflow_dispatch:
    inputs:
      alias:
        description: اسم المفتاح داخل السلسلة
        required: true
        default: mazad
      validity_days:
        description: مدّة الصلاحية بالأيام (Play يشترط ما بعد 2033)
        required: true
        default: '10000'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: توليد المفتاح وتعميته
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPORT_PASSWORD: ${{ secrets.KEYSTORE_EXPORT_PASSWORD }}
          ALIAS: ${{ github.event.inputs.alias }}
          VALIDITY: ${{ github.event.inputs.validity_days }}
        run: |
          for name in STORE_PASSWORD KEY_PASSWORD EXPORT_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::السرّ $name غير مضبوط — أضِفه في Settings ← Secrets"
              exit 1
            fi
          done

          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 4096 -validity "$VALIDITY" \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -dname "CN=Mazad, OU=Mobile, O=Mazad, L=Riyadh, C=SA"

          # البصمة تُطبع عمدًا: هي **علنية** بطبيعتها — تُنشر في
          # `/.well-known/assetlinks.json` ليُتحقّق منها، فلا سرّ فيها.
          echo "::group::بصمة SHA-256 — ضعها في ANDROID_CERT_FINGERPRINTS"
          keytool -list -v -keystore release.keystore -alias "$ALIAS" \
            -storepass "$STORE_PASSWORD" | grep -i 'SHA256:' || true
          echo "::endgroup::"

          # التعمية قبل الرفع: مخرجات المستودع العامّ تُنزَّل بمن له وصول
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in release.keystore -out release.keystore.enc -pass env:EXPORT_PASSWORD

          # base64 للمفتاح نفسه — تضعه في ANDROID_KEYSTORE_BASE64 بعد فكّه
          rm -f release.keystore

      - name: رفع المفتاح معمًّى
        uses: actions/upload-artifact@v4
        with:
          name: keystore-encrypted
          path: release.keystore.enc
          # مدّةٌ قصيرة: نزّله وفُكّه واحذفه من هنا
          retention-days: 1

      - name: ما تفعله بعد هذا
        run: |
          cat <<'AR'
          ١) نزّل `keystore-encrypted` من مخرجات هذا التشغيل.
          ٢) فُكّ تعميته على جهازك:
               openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
                 -in release.keystore.enc -out release.keystore
          ٣) احفظ `release.keystore` في مكانٍ آمن — ضياعه يمنع تحديث التطبيق.
          ٤) حوّله إلى base64 وضعه في السرّ ANDROID_KEYSTORE_BASE64:
               base64 -i release.keystore | pbcopy
          ٥) خذ بصمة SHA-256 من سجلّ هذا التشغيل وضعها في
             ANDROID_CERT_FINGERPRINTS في بيئة الخادم.
          ٦) احذف مخرجات هذا التشغيل من صفحة الأكشن.

          وبعد أوّل رفعٍ إلى Play مع «توقيع تطبيق Play»: خذ البصمة من لوحة
          Play لا من هذا المفتاح — جوجل تُعيد التوقيع بمفتاحها، فبصمتُك
          المحلّية لا تطابق ما يصل الأجهزة.
          AR
