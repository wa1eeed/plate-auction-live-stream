# ==============================================================
#  وكيل عكسي أمام سوق اللوحات — nginx
#
#  ضعه في /etc/nginx/conf.d/plate-auction.conf ثم:
#    sudo nginx -t && sudo systemctl reload nginx
#
#  ⚠ هذا الملفّ هو ما يحيا به المزاد اللحظي أو يموت.
#  بلا تمرير ترقية WebSocket يسقط /ws بصمت — لا خطأ في السجلّ ولا رسالة
#  للمستخدم، بل مزايدات لا تصل إلا بتحديث الصفحة. وهو أكثر ما يُعطب في
#  النشر على خادم خاص.
# ==============================================================

# ترويسة `Connection` تُبنى من `Upgrade`: تصير `upgrade` لطلب الترقية،
# و`close` لغيره. وهذا `map` موضعه سياق `http` — وملفّات conf.d داخله.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream plate_auction {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.example.com;   # ← ضع نطاقك

    # certbot يكتب تحويل HTTPS هنا:
    #   sudo certbot --nginx -d staging.example.com

    # اللوحات صور SVG مضمّنة والحُزم كبيرة — الضغط يقصّر أوّل تحميل
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ------- مقبس المزاد اللحظي -------
    location /ws {
        proxy_pass http://plate_auction;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # مهلة القراءة أطول من نبضة الخادم.
        #
        # نبضة server.mjs كل ٣٠ ثانية، والمهلة الافتراضية في nginx ٦٠. ومقبسٌ
        # صامت بين نبضتين يُقطع عند أوّل هدوء — فيرى المزايد اتصالًا يسقط
        # ويعود كل دقيقة بلا سبب ظاهر.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    # ------- بقيّة التطبيق -------
    location / {
        proxy_pass http://plate_auction;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;

        # رفع صور اللوحات المخصّصة
        client_max_body_size 8m;
    }
}
