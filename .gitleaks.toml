# فحص الأسرار المسرَّبة — والاستثناءات **محدّدةٌ بقيمتها** لا بمسارٍ ولا بقاعدة.
#
# واستثناءُ ملفٍّ كامل أو قاعدةٍ كاملة يُسكت الفحص عمّا يأتي بعده أيضًا: سرٌّ
# حقيقيّ يُدفع غدًا إلى الملفّ نفسه يمرّ بلا صوت. فما يُستثنى هنا قيمةٌ بعينها.

[extend]
useDefault = true

[allowlist]
description = "قيمٌ معروفةٌ ليست أسرارًا"
regexes = [
  # مفتاح المثال في معيار WebSocket (RFC 6455 §1.3) — نصُّه «the sample nonce».
  # يظهر في README ضمن أمر `curl` يتحقّق أنّ الوسيط يمرّر ترقية `/ws`.
  '''dGhlIHNhbXBsZSBub25jZQ==''',
]
